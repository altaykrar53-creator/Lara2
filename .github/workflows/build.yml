name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: unzip project
        run: |
          unzip lara-terminal-final.zip
          ls

      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: install ldid
        run: brew install ldid

      - name: build
        run: |
          cd lara-fixed
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: lara-fixed/build/lara.ipa
